# PostgreSQL za lokalni rad. Pri prvom pokretanju učita data/schema.sql i data/seed.sql.
# Početni podaci ispočetka: docker compose down -v && docker compose up -d
services:
  baza:
    image: postgres:18
    environment:
      POSTGRES_USER: praksa
      POSTGRES_PASSWORD: praksa
      POSTGRES_DB: narudzbe
    ports:
      - "5432:5432"
    volumes:
      - podaci:/var/lib/postgresql
      - ./data/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./data/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro

volumes:
  podaci:
